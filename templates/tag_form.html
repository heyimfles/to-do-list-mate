{% extends "base.html" %}
{% block content %}

<div class="container">

  <h1 class="display-4 mb-4">
    {{ object|yesno:"Update Tag,Create Tag" }}
  </h1>

  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label for="{{ form.name.id_for_label }}">
        Name
      </label>
      {{ form.name }}
    </div>

    <button type="submit" class="btn btn-primary">
      Save
    </button>

    <a href="{% url 'to_do_list:tags_list' %}"
       class="btn btn-secondary">
      Cancel
    </a>
  </form>

</div>

{% endblock %}
